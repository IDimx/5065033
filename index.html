<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>لیست بهترین سرورها</title>
  <style>
    :root {
      --bg-canvas: #f1f5f9;
      --bg-panel: #d7d7d7;
      --bg-subtle: #f8fafc;
      --bg-muted: #eef2f6;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --border-light: #e2e8f0;
      --border-medium: #cbd5e1;
      --brand: #0284c7;
      --brand-hover: #0369a1;
      --brand-tint: #e0f2fe;
      --emerald: #16a34a;
      --emerald-hover: #15803d;
      --emerald-tint: #dcfce7;
      --radius-panel: 24px;
      --radius-card: 16px;
      --radius-control: 12px;
      --shadow-panel: 0 18px 40px -16px rgba(15, 23, 42, 0.12), 0 2px 6px rgba(15, 23, 42, 0.04);
      --shadow-card: 0 2px 8px rgba(15, 23, 42, 0.03);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      min-height: 100%;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      font-family: Vazir, 'Segoe UI', Tahoma, sans-serif;
      background: radial-gradient(circle at 85% 0%, #6c737d 0%, #749376 45%, #916363 100%);
      color: var(--text-primary);
      font-variant-numeric: tabular-nums;
    }

    .card {
      max-width: 1080px;
      margin: 0 auto;

      border-radius: var(--radius-panel);
      padding: 20px;

      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding: 4px 6px 0 6px;
justify-content: center;
    }

    .meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0;
    }

    .title {
      font-size: 16px;
      font-weight: 800;
      color: var(--text-primary);
    }

    .card-tag {
      font-size: 11px;
      font-weight: 700;
      color: var(--emerald-hover);
      background: var(--emerald-tint);
      padding: 3px 10px;
      border-radius: 999px;
    }

    .copy-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-family: Vazir, 'Segoe UI', Tahoma, sans-serif;
      background: var(--emerald);
      color: #ffffff;
      border: 1px solid #0000004d;
      padding: 10px 18px;
      border-radius: var(--radius-control);
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      box-shadow: 0 3px 10px rgba(22, 163, 74, 0.18);
      transition: all 0.18s ease;
    }

    .copy-btn:hover {
      background: var(--emerald-hover);
      transform: translateY(-1px);
    }

    .copy-btn:active {
      transform: translateY(0);
    }

    .copy-btn[disabled] {
      background: #94a3b8;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    .btn-icon {
      width: 17px;
      height: 17px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .box {
      background: var(--bg-subtle);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-card);
      padding: 14px;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }

    .box-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-secondary);
      padding-bottom: 12px;
    }

    .sub {
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
    }

    textarea {
      direction: ltr;
      text-align: left;
      width: 100%;
      min-height: 320px;
      padding: 12px 14px;
      background: var(--bg-panel);
      border: 1px solid var(--border-medium);
      border-radius: var(--radius-control);
      color: var(--text-primary);
      font-family: Vazir, 'Segoe UI', Tahoma, sans-serif;
      font-size: 13px;
      line-height: 1.65;
      resize: vertical;
      cursor: text;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    textarea:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.12);
    }

    .status {
      display: none;
    }

    .toast-box {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(14px);
      background: #ffffff;
      color: var(--text-primary);
      padding: 12px 20px;
      border-radius: 14px;
      font-family: Vazir, 'Segoe UI', Tahoma, sans-serif;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 14px 32px rgba(15, 23, 42, 0.16);
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 9999;
      border: 1px solid #bbf7d0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toast-box.error {
      background: #fef2f2;
      color: #991b1b;
      border-color: #fecaca;
    }

    .toast-box.show {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 520px) {
      .top-bar {
        flex-direction: column;
        align-items: stretch;
      }

      .copy-btn {
        width: 100%;
      }
    }
  </style>
</head>

  <div id="customToast" class="toast-box" aria-live="polite"></div>

  <script>
    const textarea = document.getElementById('content');
    const copyBtn = document.getElementById('copyBtn');
    const status = document.getElementById('status');
    const box = document.getElementById('box');
    const toast = document.getElementById('customToast');
    let toastTimer = null;

    function notify(message, isError = false) {
      status.textContent = message;
      const iconSvg = isError
        ? '<svg style="width:19px;height:19px;stroke:#dc2626;fill:none;stroke-width:2.2;flex-shrink:0;" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>'
        : '<svg style="width:19px;height:19px;stroke:#16a34a;fill:none;stroke-width:2.2;flex-shrink:0;" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>';

      toast.innerHTML = iconSvg + `<span>${message}</span>`;
      toast.className = isError ? 'toast-box error show' : 'toast-box show';

      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.className = isError ? 'toast-box error' : 'toast-box';
        status.textContent = '';
      }, 1800);
    }

    async function copyText() {
      const text = textarea.value;
      if (!text) {
        notify('متنی برای کپی وجود ندارد', true);
        return;
      }
      try {
        await navigator.clipboard.writeText(text);
        notify('کپـی شـد');
      } catch (err) {
        textarea.select();
        try {
          document.execCommand('copy');
          notify('کپی شد');
        } catch (e) {
          notify('کپی ناموفق بود.', true);
        }
        window.getSelection().removeAllRanges();
      }
    }

    copyBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      copyText();
    });

    box.addEventListener('click', (e) => {
      if (document.activeElement === textarea) return;
      copyText();
    });

    textarea.addEventListener('click', (e) => {
      e.stopPropagation();
    });

    textarea.addEventListener('focus', () => {
      status.textContent = '';
    });
  </script>
