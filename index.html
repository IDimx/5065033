    html,body{height:100%}
    body{margin:0;font-family: "Vazir", "Segoe UI";background:#202020;color:#ecf0f5;display:flex;align-items:center;justify-content:center;padding:32px;direction:ltr;}

    .copy-btn[disabled]{ opacity:.6; cursor:not-allowed; }

    .meta{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
    .title{font-size:16px;font-weight:700;letter-spacing:0.2px;}
    .sub{color:var(--muted);font-size:13px;}

    .box{background: var(--glass);margin-top: 3%;border: 1px solid rgba(255,255,255,0.04);border-radius:10px;padding:12px;min-height:320px;display:flex;flex-direction:column;}

    textarea{width:100%;height:100%;min-height:260px;resize:vertical;border:0;outline:none;background:transparent;color:inherit;font-size:15px;line-height:1.6;padding:8px;font-family: "Vazir", "Segoe UI";}

    .status{font-size:20px;color:#00ff3c;position: fixed;top: 5%;left: 10%;}

    @media (max-width:520px){.copy-btn{ padding:10px 20px; font-size:15px; transform:translateX(-50%) scale(.8); }}
  </style>

  <script>
    const textarea = document.getElementById('content');
    const copyBtn = document.getElementById('copyBtn');
    const status = document.getElementById('status');
    const box = document.getElementById('box');

    async function copyText() {
      const text = textarea.value;
      if (!text) {
        status.textContent = 'متنی برای کپی وجود ندارد';
        setTimeout(()=> status.textContent = '', 1400);
        return;
      }
      try {
        await navigator.clipboard.writeText(text);
        status.textContent = 'کپی شد';
        setTimeout(()=> status.textContent = '', 1200);
      } catch (err) {
        textarea.select();
        try {
          document.execCommand('copy');
          status.textContent = 'کپی شد';
          setTimeout(()=> status.textContent = '', 1200);
        } catch (e) {
          alert('کپی ناموفق بود.');
        }
        window.getSelection().removeAllRanges();
      }
    }

    copyBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      copyText();
    });

    box.addEventListener('click', (e) => {
      if (document.activeElement === textarea) return;
      copyText();
    });

    textarea.addEventListener('click', (e) => {
      e.stopPropagation();
    });
    textarea.addEventListener('focus', () => {
      status.textContent = '';
    });


  </script>
